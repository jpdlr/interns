<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
<radialGradient id="halo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ffb347" stop-opacity=".5"/>
<stop offset="60%" stop-color="#ff8c1a" stop-opacity=".16"/>
<stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="body" cx="38%" cy="32%" r="78%">
<stop offset="0%" stop-color="#ffe9c2"/>
<stop offset="45%" stop-color="#ffab3d"/>
<stop offset="100%" stop-color="#9c4300"/>
</radialGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#fff4dd" stop-opacity=".95"/>
<stop offset="100%" stop-color="#ffd28a" stop-opacity="0"/>
</radialGradient>
</defs>
<g transform="translate(128 128)">
<circle r="98" fill="url(#halo)">
<animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
</circle>
<g>
<animateTransform attributeName="transform" type="scale" values="1;1.045;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
<circle r="58" fill="url(#body)"/>
<ellipse cx="-16" cy="-20" rx="27" ry="21" fill="url(#core)">
<animate attributeName="opacity" values=".5;.95;.5" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
</ellipse>
</g>
<g>
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
<circle cx="77" cy="0" r="4.5" fill="#ffd9a0" opacity=".9"/>
</g>
</g>
</svg>
