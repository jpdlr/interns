<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interns — Avatar Gallery</title>
<style>
  :root {
    --bg: #0d0f14;
    --tile: #14171f;
    --text: #e8eaf0;
    --muted: #8b91a0;
    --border: #232733;
  }
  body.light {
    --bg: #f4f5f8;
    --tile: #ffffff;
    --text: #1a1d26;
    --muted: #6b7180;
    --border: #e2e5ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: background .3s, color .3s;
    padding: 40px 24px 64px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--muted); font-weight: 400; }
  #toggle {
    background: var(--tile);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font: inherit;
    cursor: pointer;
    transition: background .3s, color .3s, border-color .3s;
  }
  #toggle:hover { border-color: var(--muted); }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .tile {
    background: var(--tile);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 14px 16px;
    text-align: center;
    transition: background .3s, border-color .3s;
  }
  .tile .art { margin: 0 auto 10px; min-height: 160px; }
  .tile img { width: 160px; height: 160px; display: block; margin: 0 auto; }
  .tile .id { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .tile .vibe { font-size: 14px; font-weight: 550; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Interns <span>— avatar concepts, 20 luminous beings</span></h1>
    <nav class="themes" style="font-size:13px;color:var(--muted)"><span style="color:var(--text);font-weight:600">Blobs</span> | <a href="faces/preview.html" style="color:var(--muted);text-decoration:none">Bot faces</a></nav>
  </div>
  <button id="toggle" type="button">Light background</button>
</header>
<div class="grid" id="grid"></div>
<script>
  const avatars = [
    ["avatar-01", "Milo — warm amber orb"],
    ["avatar-02", "Nia — teal droplet"],
    ["avatar-03", "Zara — magenta flame"],
    ["avatar-04", "Kai — violet crystal"],
    ["avatar-05", "Auric — gold halo ring"],
    ["avatar-06", "Vesper — indigo ribbon"],
    ["avatar-07", "Luna — lavender nebula"],
    ["avatar-08", "Gemma — coral twin orbs"],
    ["avatar-09", "Fern — emerald spiral"],
    ["avatar-10", "Sterling — silver ripple orb"],
    ["avatar-11", "Ember — red-orange ember"],
    ["avatar-12", "Sage — spring green petal"],
    ["avatar-13", "Marlow — deep blue wave"],
    ["avatar-14", "Sol — warm white pulse star"],
    ["avatar-15", "Selene — silver-blue crescent"],
    ["avatar-16", "Citron — chartreuse ribbon flame"],
    ["avatar-17", "Nova — cyan-magenta vortex ring"],
    ["avatar-18", "Wren — pink-violet jelly"],
    ["avatar-19", "Vega — ice blue comet"],
    ["avatar-20", "Onyx — graphite knot"]
  ];
  const grid = document.getElementById("grid");
  async function build() {
    for (const [id, vibe] of avatars) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.innerHTML =
        '<div class="art"></div>' +
        '<div class="id">' + id + '</div>' +
        '<div class="vibe">' + vibe + '</div>';
      grid.appendChild(tile);
      const art = tile.querySelector(".art");
      try {
        const res = await fetch(id + ".svg");
        if (!res.ok) throw new Error(res.status);
        const sh = art.attachShadow({ mode: "open" });
        sh.innerHTML =
          "<style>:host{display:block}svg{width:160px;height:160px;display:block;margin:0 auto}</style>" +
          await res.text();
      } catch (e) {
        art.innerHTML = '<img src="' + id + '.svg" alt="' + vibe + '" width="160" height="160">';
      }
    }
  }
  build();
  const btn = document.getElementById("toggle");
  btn.addEventListener("click", () => {
    document.body.classList.toggle("light");
    btn.textContent = document.body.classList.contains("light")
      ? "Dark background" : "Light background";
  });
</script>
</body>
</html>
