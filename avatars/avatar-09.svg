<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
<radialGradient id="halo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#10b981" stop-opacity=".45"/>
<stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
</radialGradient>
<radialGradient id="core" cx="42%" cy="36%" r="75%">
<stop offset="0%" stop-color="#dcfce9"/>
<stop offset="50%" stop-color="#34d399"/>
<stop offset="100%" stop-color="#065f46"/>
</radialGradient>
<linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#6ee7b7"/>
<stop offset="100%" stop-color="#065f46" stop-opacity=".1"/>
</linearGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4"/>
</filter>
</defs>
<g transform="translate(128 128)">
<circle r="96" fill="url(#halo)">
<animate attributeName="opacity" values=".65;1;.65" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
</circle>
<g filter="url(#soft)">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
<path fill="url(#arm)" d="M8,-16 C14,-56 52,-72 80,-52 C58,-58 26,-46 24,-8 Z" opacity=".95"/>
<path fill="url(#arm)" transform="rotate(180)" d="M8,-16 C14,-56 52,-72 80,-52 C58,-58 26,-46 24,-8 Z" opacity=".7"/>
<path fill="url(#arm)" transform="rotate(90)" d="M8,-16 C14,-56 52,-72 80,-52 C58,-58 26,-46 24,-8 Z" opacity=".45"/>
</g>
<circle r="27" fill="url(#core)">
<animate attributeName="r" values="27;29;27" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
</circle>
<circle cx="-7" cy="-8" r="9" fill="#eafff4" opacity=".8">
<animate attributeName="opacity" values=".45;.9;.45" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
</circle>
</g>
</svg>
