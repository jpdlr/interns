<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    .cc-head { animation: cc-breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 60%; }
    .cc-eyes { animation: cc-blink 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .cc-spark { animation: cc-twinkle 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes cc-breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.02) translateY(-2px) } }
    @keyframes cc-blink { 0%,91%,100% { transform: scaleY(1) } 93%,95% { transform: scaleY(0.08) } 97% { transform: scaleY(1) } }
    @keyframes cc-twinkle { 0%,100% { transform: scale(0.7) rotate(0deg); opacity:.45 } 50% { transform: scale(1.15) rotate(45deg); opacity:1 } }
  </style>
  <defs>
    <filter id="cc-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b0d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g class="cc-head" filter="url(#cc-soft)">
    <!-- head -->
    <rect x="52" y="66" width="152" height="142" rx="70" fill="#f8fafc"/>
    <!-- headset band -->
    <path d="M66 118 A64 64 0 0 1 190 118" fill="none" stroke="#1e2430" stroke-width="11" stroke-linecap="round"/>
    <!-- earpieces -->
    <rect x="47" y="106" width="16" height="34" rx="8" fill="#1e2430"/>
    <rect x="193" y="106" width="16" height="34" rx="8" fill="#1e2430"/>
    <!-- mic boom + tip -->
    <path d="M58 138 Q64 172 96 178" fill="none" stroke="#1e2430" stroke-width="8" stroke-linecap="round"/>
    <circle cx="103" cy="179" r="8" fill="#1e2430"/>
    <!-- eyes: alert, slightly uneven — someone is coordinating chaos -->
    <g class="cc-eyes">
      <rect x="107" y="122" width="11" height="34" rx="5.5" fill="#1e2430" transform="rotate(-4 112 139)"/>
      <rect x="143" y="118" width="11" height="34" rx="5.5" fill="#1e2430" transform="rotate(4 148 135)"/>
    </g>
  </g>
  <!-- the chaos spark -->
  <path class="cc-spark" d="M214 52 L219 64 L231 69 L219 74 L214 86 L209 74 L197 69 L209 64 Z" fill="#f8fafc"/>
</svg>
