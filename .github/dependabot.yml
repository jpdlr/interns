version: 2
updates:
  - package-ecosystem: npm
    directory: /orchestrator
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The orchestrator runs on Node 22 (CI and the systemd service), so its types stay on 22.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Expo pins a matching set of React Native packages; move them together with `npx expo install --fix`.
    ignore:
      - dependency-name: "expo*"
        update-types: [version-update:semver-major]
      - dependency-name: "react-native*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@expo/*"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Also pinned by the Expo SDK (see `npx expo install --check`).
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
