name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      # video posters, lengths and thumbnails (src/media.ts) and their tests
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            orchestrator/package-lock.json
      - run: npm ci
        working-directory: orchestrator   # the schedule check borrows its tsx
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run check:schedule
        working-directory: app
      - run: npm run check:stream
        working-directory: app
      - run: npm run export:web
        working-directory: app
